[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-code"
version = "0.1.0"
description = "Local voice input and speech output for Claude Code"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1,<3",
  "sounddevice>=0.5,<0.6",
  "faster-whisper>=1.2.1,<2",
  "pyttsx3>=2.98,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
voice-code = "voice_code.__main__:main"

[tool.setuptools.packages.find]
include = ["voice_code*"]
